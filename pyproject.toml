[project]
name = "terminal"
version = "0.1.0"
description = "Poor man's Bloomberg terminal: free-data market dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.40"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["terminal*"]

[tool.setuptools.package-data]
terminal = ["data/*", "web/*", "web/vendor/*"]
