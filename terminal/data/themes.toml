# Themes: keywords -> affected assets. direction: 1 up, -1 down, 0 affected but direction unclear.
# A keyword with a capital letter is matched case-sensitively ("Fed" will not match "fed up").
# Order matters: when two themes name the same asset, the first one wins. Put specific themes first.

[[theme]]
name = "rate cuts / dovish"
keywords = ["rate cut", "rate cuts", "cuts rates", "cut rates", "cutting rates", "dovish", "monetary easing", "lowers rates", "lower interest rates"]
impacts = [{symbol = "TLT", direction = 1}, {symbol = "^TNX", direction = -1}, {symbol = "QQQ", direction = 1}, {symbol = "GC=F", direction = 1}, {symbol = "DX-Y.NYB", direction = -1}]

[[theme]]
name = "rate hikes / hawkish"
keywords = ["rate hike", "rate hikes", "hikes rates", "raises rates", "raise rates", "hawkish", "tightening cycle", "higher for longer"]
impacts = [{symbol = "TLT", direction = -1}, {symbol = "^TNX", direction = 1}, {symbol = "QQQ", direction = -1}, {symbol = "GC=F", direction = -1}, {symbol = "DX-Y.NYB", direction = 1}]

