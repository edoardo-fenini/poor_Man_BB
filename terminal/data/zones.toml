# Conflict zones. `query` is a GDELT search expression for the place; `assets` are what the zone moves.
# direction: 1 up when the zone heats up, -1 down, 0 affected with unclear direction.

[[zone]]
name = "Middle East / Gulf"
query = "(israel OR gaza OR iran OR lebanon OR hezbollah OR hormuz OR \"saudi arabia\")"
assets = [{symbol = "CL=F", direction = 1}, {symbol = "BZ=F", direction = 1}, {symbol = "GC=F", direction = 1}, {symbol = "XLE", direction = 1}, {symbol = "ITA", direction = 1}, {symbol = "JETS", direction = -1}]

[[zone]]
name = "Red Sea / shipping"
query = "(\"red sea\" OR houthi OR yemen OR \"suez canal\" OR \"bab el-mandeb\")"
assets = [{symbol = "BZ=F", direction = 1}, {symbol = "ZIM", direction = 1}]

[[zone]]
name = "Taiwan Strait"
query = "(taiwan OR \"taiwan strait\")"
assets = [{symbol = "TSM", direction = -1}, {symbol = "SMH", direction = -1}, {symbol = "NVDA", direction = -1}, {symbol = "GC=F", direction = 1}]

[[zone]]
name = "Ukraine / Black Sea"
query = "(ukraine OR kyiv OR \"black sea\" OR crimea)"
assets = [{symbol = "ZW=F", direction = 1}, {symbol = "NG=F", direction = 1}, {symbol = "ITA", direction = 1}, {symbol = "EZU", direction = -1}]

[[zone]]
name = "Korean peninsula"
query = "(\"north korea\" OR pyongyang OR \"korean peninsula\")"
assets = [{symbol = "EWY", direction = -1}, {symbol = "GC=F", direction = 1}]

[[zone]]
name = "South China Sea"
query = "(\"south china sea\" OR spratly OR scarborough)"
assets = [{symbol = "FXI", direction = -1}, {symbol = "GC=F", direction = 1}]

[[zone]]
name = "India-Pakistan"
query = "(kashmir OR \"line of control\")"
assets = [{symbol = "INDA", direction = -1}]

[[zone]]
name = "Sahel / West Africa"
query = "(niger OR mali OR \"burkina faso\" OR sahel OR sudan)"
assets = [{symbol = "GC=F", direction = 1}, {symbol = "URA", direction = 1}]

[[zone]]
name = "Venezuela / Caribbean"
query = "(venezuela OR caracas OR essequibo)"
assets = [{symbol = "CL=F", direction = 1}, {symbol = "CVX", direction = 0}]
